# Phone smoke test on every PR and push to main: iPhone (WebKit) and Android (Chromium) sizes, portrait and landscape.
# Screenshots are uploaded as an artifact either way, so a failure can be looked at, not just read.
name: mobile-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    # The apt mirror behind --with-deps sometimes crawls (10+ minutes); the tests themselves take a few.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No timeout or retry around this: killing the installer leaves its apt-get running and holding the lock, so a
      # retry only fails faster. A slow apt mirror is waited out under the job's limit instead.
      - run: |
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-lock-wait
          npx playwright install --with-deps chromium webkit
      - run: npm run build:single
      - run: npm run mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/mobile
          retention-days: 14
