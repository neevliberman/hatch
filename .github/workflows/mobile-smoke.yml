# Phone smoke test on every PR and push to main: iPhone (WebKit) and Android (Chromium) sizes, portrait and landscape.
# Then the first-frames check (scripts/firstframes.mjs), which uses the same two engines.
# Screenshots are uploaded as an artifact either way, so a failure can be looked at, not just read.
name: mobile-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    # The apt mirror behind --with-deps sometimes crawls (10+ minutes); the tests themselves take a few.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Ubuntu apt mirror sometimes stalls and the step would sit until the job's 30-minute limit: give each try 8
      # minutes and try twice.
      - run: timeout 480 npx playwright install --with-deps chromium webkit || timeout 480 npx playwright install --with-deps chromium webkit
      - id: build
        run: npm run build:single
      - run: npm run mobile
      # The first seconds of load, which the step above skips: fails on a stretched or misplaced first map frame, and
      # films each screen (phones and two desktops) for the visual review in CONTRIBUTING.md. About 40 s.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run firstframes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: |
            screenshots/mobile
            screenshots/firstframes
          retention-days: 14
