# Phone smoke test on every PR and push to main: iPhone (WebKit) and Android (Chromium) sizes, portrait and landscape.
# Screenshots are uploaded as an artifact either way, so a failure can be looked at, not just read.
name: mobile-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    # The apt mirror behind --with-deps sometimes crawls (10+ minutes); the tests themselves take a few.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Ubuntu apt mirror sometimes stalls and the step would sit until the job's 30-minute limit: give each try 8
      # minutes, and after a failed try (a mirror mid-sync fails fast) wait, refresh the package lists and try again.
      - run: |
          for i in 1 2 3; do
            timeout 480 npx playwright install --with-deps chromium webkit && exit 0
            sleep 30; sudo apt-get update -q || true
          done
          exit 1
      - run: npm run build:single
      - run: npm run mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/mobile
          retention-days: 14
