# Publish the app to GitHub Pages (https://neevliberman.github.io/hatch/) on every push to main.
# Builds dist/ and force-replaces the gh-pages branch with it; Pages serves that branch as-is.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The nightly live forecast lives on the `live-data` branch (written by live-forecast.yml); it replaces the
      # copy bundled from main so a redeploy never rolls the live map back. No branch yet = keep main's copy.
      - name: Add newest live forecast
        run: |
          set -euo pipefail
          # exit 2 = no such branch (fall back); any other failure stops the deploy rather than rolling back
          set +e; git ls-remote --exit-code --heads origin live-data >/dev/null; RC=$?; set -e
          if [ "$RC" = 0 ]; then
            git fetch -q --depth 1 origin live-data
            mkdir -p dist/live
            git show FETCH_HEAD:live/latest.json > dist/live/latest.json
            echo "live forecast from live-data branch"
          elif [ "$RC" = 2 ]; then
            echo "no live-data branch; using main's public/live"
          else
            echo "could not check the live-data branch (exit $RC)"; exit 1
          fi
      - name: Push dist to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "hatch-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
