# Nightly: save raw NWS gridded forecasts to the `forecast-archive` branch (archive/YYYY-MM-DD/<point>.json).
# Runs year-round: the archive is the only record of past forecasts. First green run 2026-10-22 (21/21 points).
name: forecast-archive
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write  # keepalive step below
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch forecasts
        run: python3 scripts/archive/save_forecasts.py "$RUNNER_TEMP/out"
      - name: Commit to forecast-archive branch
        run: |
          set -euo pipefail
          D=$(date -u +%F)
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          cd "$RUNNER_TEMP"
          git clone --branch forecast-archive --single-branch "$REPO" fa 2>/dev/null || {
            git init -q fa && cd fa && git checkout -q -b forecast-archive && git remote add origin "$REPO" && cd ..
          }
          cd fa
          mkdir -p "archive/$D"
          cp "$RUNNER_TEMP"/out/*.json "archive/$D/"
          git config user.name "hatch-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "forecast archive $D"
          git push origin forecast-archive
      # GitHub switches off scheduled workflows in public repos after 60 days without repo activity.
      # Re-enabling the (already enabled) workflow through the API resets that clock, so a quiet repo keeps archiving.
      - name: Keepalive
        if: always()
        continue-on-error: true  # a keepalive hiccup must not paint a good archive night red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/forecast-archive.yml/enable"
