# Desktop smoke test on every PR and push to main: Chromium, Firefox and WebKit at laptop to 1440p sizes, mouse and keyboard.
# Firefox only gets WebGL with a display, so the run goes under xvfb. Screenshots are uploaded either way.
name: desktop-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    # The apt mirror behind --with-deps sometimes crawls (10+ minutes); the tests themselves take about 3.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No timeout or retry around this: killing the installer leaves its apt-get running and holding the lock, so a
      # retry only fails faster. A slow apt mirror is waited out under the job's limit instead.
      - run: |
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-lock-wait
          npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:all   # dist/ too: the live-mode checks serve it over http
      - run: xvfb-run -a npm run desktop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: screenshots/desktop
          retention-days: 14
