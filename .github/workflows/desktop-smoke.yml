# Desktop smoke test on every PR and push to main: Chromium, Firefox and WebKit at laptop to 1440p sizes, mouse and keyboard.
# Each engine is its own job, run side by side in Playwright's official image (browsers and their system libraries
# already inside, so no apt install: that install used to take 40 s on a good day and 35+ minutes on a bad one).
# Firefox only gets WebGL with a display, so the run goes under xvfb. Screenshots are uploaded either way, then merged
# into one "desktop-screenshots" artifact by the "desktop" job, which is also the one pass/fail check for the workflow.
name: desktop-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine:
    name: desktop (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # Keep the tag in step with the playwright version in package.json: the image's browsers are built for it.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one engine failing still lets the others report
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      HOME: /root        # Firefox refuses to start as root with the runner's HOME
      ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4   # the image's own Node; this only restores the npm cache
        with:
          cache: npm
      - run: npm ci
      # dist/ too on Chromium: the live-mode and zoomed-in checks serve it over http.
      - id: build
        run: npm run ${{ matrix.engine == 'chromium' && 'build:all' || 'build:single' }}
      - run: xvfb-run -a npm run desktop
      # Zoomed in: the finer hexagons (res 5 and 6) load over http, draw, and give a card when tapped. Not yet a gate:
      # main's fine.mjs needs the fixes in PR #39, which drops continue-on-error when it lands.
      - if: ${{ matrix.engine == 'chromium' && !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: xvfb-run -a npm run fine
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-${{ matrix.engine }}
          path: |
            screenshots/desktop
            screenshots/fine
          retention-days: 14
  desktop:
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        continue-on-error: true   # nothing to merge when every engine failed before taking a screenshot
        with:
          name: desktop-screenshots
          pattern: desktop-screenshots-*
          delete-merged: true
          retention-days: 14
      - name: All engines passed
        run: test "${{ needs.engine.result }}" = success
