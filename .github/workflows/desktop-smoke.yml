# Desktop smoke test on every PR and push to main: Chromium, Firefox and WebKit at laptop to 1440p sizes, mouse and keyboard.
# Firefox only gets WebGL with a display, so the run goes under xvfb. Screenshots are uploaded either way.
name: desktop-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    # The apt mirror behind --with-deps sometimes crawls (10+ minutes); the tests themselves take about 3.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Ubuntu apt mirror sometimes stalls and the step would sit until the job's 30-minute limit: give each try 8
      # minutes, and after a failed try (a mirror mid-sync fails fast) wait, refresh the package lists and try again.
      - run: |
          # The runner image can still be running its own apt-get at start: wait for its lock instead of failing at once.
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-lock-wait
          for i in 1 2 3; do
            timeout 480 npx playwright install --with-deps chromium firefox webkit && exit 0
            sleep 30; sudo apt-get update -q || true
          done
          exit 1
      - run: npm run build:all   # dist/ too: the live-mode checks serve it over http
      - run: xvfb-run -a npm run desktop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: screenshots/desktop
          retention-days: 14
