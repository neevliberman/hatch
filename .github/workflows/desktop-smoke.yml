# Desktop smoke test on every PR and push to main: Chromium, Firefox and WebKit at laptop to 1440p sizes, mouse and keyboard.
# Each engine (and the zoomed-in check) is its own job, run side by side in Playwright's official image (browsers and their system libraries
# already inside, so no apt install: that install used to take 40 s on a good day and 35+ minutes on a bad one).
# Firefox only gets WebGL with a display, so the run goes under xvfb. Screenshots are uploaded either way, then merged
# into one "desktop-screenshots" artifact by the "desktop" job, which is also the one pass/fail check for the workflow.
name: desktop-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A new push to a PR cancels that PR's older run; every other run (main, manual) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine:
    name: desktop (${{ matrix.suite == 'fine' && 'fine' || matrix.engine }})
    runs-on: ubuntu-latest
    # Keep the tag in step with the playwright version in package.json: the image's browsers are built for it.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one job failing still lets the others report
      matrix:
        include:
          # dist/ for Chromium: the live-mode checks serve it over http. dist-single/ is what the screens load.
          - { suite: desktop, engine: chromium, build: 'build:all' }
          - { suite: desktop, engine: firefox, build: 'build:single' }
          - { suite: desktop, engine: webkit, build: 'build:single' }
          # Zoomed in (scripts/fine.mjs, Chromium, dist/ over http): the finer hexagons load, draw, and give a card when
          # tapped, and a season switch never flashes back to the big ones. Its own job since it takes ~4 minutes.
          - { suite: fine, engine: chromium, build: build }
    env:
      HOME: /root        # Firefox refuses to start as root with the runner's HOME
      ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4   # the image's own Node; this only restores the npm cache
        with:
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.build }}
      - run: xvfb-run -a npm run ${{ matrix.suite }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-${{ matrix.suite }}-${{ matrix.engine }}
          path: |
            screenshots/desktop
            screenshots/fine
          retention-days: 14
  desktop:
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        continue-on-error: true   # nothing to merge when every engine failed before taking a screenshot
        with:
          name: desktop-screenshots
          pattern: desktop-screenshots-*
          overwrite: true   # per-engine artifacts are kept, so re-running one engine merges all of them again
          retention-days: 14
      - name: All engines passed
        run: test "${{ needs.engine.result }}" = success
