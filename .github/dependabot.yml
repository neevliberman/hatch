# Monthly check for outdated or vulnerable packages and Actions. Updates are grouped, so each ecosystem opens at most
# one PR a month (each PR runs the full browser test matrix). Nothing merges itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm-all: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions-all: { patterns: ["*"] }
