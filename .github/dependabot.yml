# Quiet on purpose. Version-update PRs are off (limit 0) because each one runs the full browser test matrix and
# emails the repo owner (opens, closes and CI results all do). Security updates are separate: they still open a PR when a
# package has a known vulnerability, if "Dependabot security updates" is on in Settings > Code security.
# To check for newer versions by hand, raise a limit (for example 1) and merge; Dependabot will open one grouped PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      npm-all: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      actions-all: { patterns: ["*"] }
