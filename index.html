<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Hatch · when luna moths fly in the Midwest</title>
  <meta name="description" content="A heat-based forecast of when luna moths emerge across the Midwest, replayed against 3,000 real iNaturalist sightings." />
  <meta property="og:title" content="Hatch · when luna moths fly" />
  <meta property="og:description" content="Scrub through a season and watch luna moths roll north with the warmth. Real sightings vs a heat forecast." />
  <meta property="og:image" content="https://neevliberman.github.io/hatch/og.png" />
  <meta property="og:url" content="https://neevliberman.github.io/hatch/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f5d76e'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Map of the Midwest: luna moth sightings over a hex grid coloured by the heat forecast"></div>
    <header id="top">
      <div class="brand"><span class="dot"></span>Hatch <small>luna moths, replayed</small></div>
      <label class="season"><span class="sr">Season to replay</span><select id="season"></select></label>
      <button id="info-btn" class="icon-btn" aria-label="About this map" aria-expanded="false" aria-controls="drawer">i</button>
    </header>
    <div id="sub">
    <section id="layers" aria-label="Layers"></section>
    <p id="honesty"><span>Real sightings, <b id="season-name"></b> · forecast is a first test, not yet confirmed</span>
      <button id="why" type="button">why?</button></p>
    <p id="countdown"></p>
    <div id="actions">
      <button id="locate" type="button" class="pill">My area</button>
      <button id="share" type="button" class="pill">Share this view</button>
      <span id="action-msg" role="status" aria-live="polite"></span>
    </div>
    </div>
    <aside id="drawer" aria-hidden="true" aria-label="Caveats"></aside>
    <div id="bottom">
      <div id="floats">
        <div id="legend"></div>
        <div id="probe" role="status" aria-live="polite" hidden></div>
      </div>
      <footer id="bar" aria-label="Time controls"></footer>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
