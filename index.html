<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f2e3" />
  <!-- Light or dark before first paint: the saved choice, else the system setting (src/theme.ts keeps both in step). -->
  <script>
    try {
      var t = localStorage.getItem('hatch-theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#241f19');
    } catch (e) {}
  </script>
  <title>Hatch · Historical and predictive insect tracking</title>
  <meta name="description" content="Historical and predictive insect tracking across the Midwest, checked against real iNaturalist sightings." />
  <link rel="canonical" href="https://neevliberman.github.io/hatch/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Hatch" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Link previews (iMessage, Slack, LinkedIn, Discord, X). Scrapers need absolute URLs. Rebuild og.png: npm run og -->
  <meta property="og:site_name" content="Hatch" />
  <meta property="og:title" content="Hatch · Historical and predictive insect tracking" />
  <meta property="og:description" content="Watch insects emerge across the Midwest. A forecast, checked against real sightings." />
  <meta property="og:image" content="https://neevliberman.github.io/hatch/og.png?v=3" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Hatch logo, a bug peeking out of a cracked shell, beside a Midwest map colored by where luna moths fly in mid-June." />
  <meta property="og:url" content="https://neevliberman.github.io/hatch/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hatch · Historical and predictive insect tracking" />
  <meta name="twitter:description" content="Watch insects emerge across the Midwest. A forecast, checked against real sightings." />
  <meta name="twitter:image" content="https://neevliberman.github.io/hatch/og.png?v=3" />
  <meta name="twitter:image:alt" content="The Hatch logo, a bug peeking out of a cracked shell, beside a Midwest map colored by where luna moths fly in mid-June." />
</head>
<body>
  <div id="app">
    <main>
      <div id="map" role="img" aria-label="Midwest map: luna moth sightings over forecast hexagons" aria-describedby="sr-summary"></div>
      <p id="sr-summary" class="sr"></p>
      <!-- loader -->
    </main>
    <header id="top">
      <h1 class="brand"><img id="mark" class="mark" src="/src/marks/moth.svg" alt="" width="24" height="24" />Hatch <small id="tagline">Historical and predictive insect tracking</small></h1>
      <label class="season species"><span class="sr">Species</span><select id="species"><option value="luna">Luna moth</option></select></label>
      <label class="season"><span class="sr">Season to replay</span><select id="season"><option value="">All years</option></select></label>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Dark mode" aria-pressed="false" title="Dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.6 14.6A8 8 0 0 1 9.4 4.4a8.2 8.2 0 1 0 10.2 10.2z"/><path fill="currentColor" d="M17 3.2l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></g></svg>
      </button>
      <button id="info-btn" class="icon-btn" aria-label="About this map" aria-expanded="false" aria-controls="drawer">i</button>
      <div id="explore" class="sr explore icon-btn" role="application" tabindex="0" aria-roledescription="map explorer" aria-label="Explore map with keys" aria-describedby="explore-help">Explore map with keys</div>
      <span id="explore-help" class="sr">Arrow keys move between hexagons and read the forecast. Escape exits.</span>
    </header>
    <aside id="drawer" aria-hidden="true" aria-label="About this map"></aside>
    <div id="bottom" role="region" aria-label="Key and time controls">
      <section id="layers" aria-label="Layers" hidden></section>
      <div id="floats">
        <div id="legend"></div>
        <div id="probe" role="status" aria-live="polite" hidden></div>
      </div>
      <button id="recenter" type="button" class="icon-btn" aria-label="Back to the whole Midwest" title="Back to the whole Midwest" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 8.5l.3-.4.1-.6 0-.7.1-.8 0-.6.1-.5.1-.3 0-.3.1-.2-.1.1-.1 0 .1 0 .4-.1.9 0 .6-.1 1.4 0 .6-.1.5-.3 0-.5-.4-.4-.5-.2-.7-.1-.8-.2-1.2-.2-.3 0-.3-.1-.8 0-.5.1-.4.3-.3.4-.2.4-.2.8 0 1.5.1.7.2.8.1.7.2.6.4.4zm12-5.1l.4.3.6.1 1.5.2.6.1.6 0 .4.1.6 0 .1.1-.3-.3-.1-.2.1.1 0 1.5.1.7 0 .7.2 1.3.3.5.4 0 .4-.4.2-.6.1-.7.2-.7.1-.7.1-.5 0-.4.1-.3 0-.8-.1-.5-.3-.5-.5-.4-.6-.1-.4-.1-.3.1-.4 0-.4.1-.5 0-1.5.2-1.3.2-.4.4zm5.2 12l-.3.5-.1.5 0 .7-.1.7 0 .6-.1.5-.1.4 0 .3-.1.3 0 .1 0-.1.2-.1.1 0-1.1 0-.6.1-1.3 0-1.2.2-.4.3 0 .5.3.3.6.2.7.1.6.2.7.1.5 0 .6.2.4.1.4 0 .6-.1.5-.4.4-.4.2-.5 0-.5.1-.4-.1-.4 0-1-.2-1.4-.2-.6-.1-.6-.4-.4zm-12 5.3l-.4-.3-.6-.2-.7-.2-1.4-.2-.5-.1-.5 0-.4-.1-.4 0 .1 0 .4.4 0 .1 0-1.2-.1-.5-.1-.7 0-.7-.2-1.3-.3-.4-.5 0-.3.4-.2.6-.3 2.1 0 .5-.2.6 0 .4-.1.4.1.5.4.6.5.3.5.1.8 0 .3-.1 1.6 0 .7-.1.7 0 .6-.1.5-.3zm5.2-7.9l-.7.8-1.2.2-1.2-.4-.7-1 .1-1.2.8-.9 1.2-.2 1.2.5.7 1z"/></svg>
      </button>
      <form id="finder" role="search" hidden>
        <label for="find-q" class="sr">Town name</label>
        <ul id="find-list" role="listbox" aria-label="Towns" hidden></ul>
        <div class="find-row"><input id="find-q" type="text" role="combobox" aria-autocomplete="list" aria-controls="find-list" aria-expanded="false" placeholder="Town name" autocomplete="off" enterkeyhint="go">
        <button type="button" class="find-x" aria-label="Close town search">&times;</button></div>
      </form>
      <div id="dock">
        <p id="strip"><span id="honesty"><span class="dots">Dots: <span id="dots-what">moths</span> seen in the last 10 days<span class="long">, <b id="season-name"></b></span>. </span>Colors: forecast <em class="unconfirmed">(on trial in 2027)</em>.</span>
          <button id="why" type="button">How sure?</button><span id="countdown"></span></p>
        <footer id="bar" role="group" aria-label="Time controls"></footer>
        <div id="actions">
          <button id="locate" type="button" class="icon-btn" aria-label="My area" title="Forecast where you are">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10.4 6l.5.1 1.3 0 .8.1.7 0 .6.2 1 .6.5.4.9.9.6 1 .2.5.2.6.2 1.2 0 1.1-.1.6-.2.6-.1.5-.3.5-.2.5-1.2 1.2-1 .6-.6.2-.5.2-1.4.2-1.3 0-.5-.1-.6-.2-.5-.2-1-.6-1.2-1.2-.4-.5-.3-.5-.3-.6-.2-.6-.2-1 0-.6.1-.7.4-1.2.2-.5.3-.5.4-.6.4-.4.4-.5.5-.4 1-.6.7-.2.6-.2 1.4-.2.6 0 .6.1.7.2 1.4.6.6.2.4.1.2-.4-.4-.3-.5-.3-.6-.4-.7-.4-.8-.3-.8-.2-1.5 0-1.6.2-1.4.6-.7.4-.6.4-1.1 1.1-.4.6-.4.7-.4.6-.6 2.3 0 1.5.2.8.2.7.4.8.4.6.4.7 1 1 .6.5.6.4.7.4.7.3.7.2 1.6.2 2.4-.3 2.1-.9 1.2-1 .5-.5.5-.6.3-.6.3-.7.2-.8.2-1.4 0-1.4-.1-.7-.4-1.4-.4-.6-.3-.6-.5-.6-.5-.5-1.2-1-1.4-.6-1.6-.2-.8.1-.8 0-.6.2-.4.1zm.2-.3l.4.1 1.2 0 1.3.2.6.2.5.3.6.3.6.4.9.9.4.5.3.6.2.5.2.6.2 1.3 0 1.2-.2.6-.2.7-.2.6-.3.6-.9 1.5-.8.8-.4.3-.4.1-.6.1-1.5 0-.8-.2-.8-.1-.7-.2-.6-.2-.6-.1-.6-.3-.5-.2-.5-.3-.4-.3-.3-.5-.4-.5-.6-1.2-.2-1.2-.1-.5.1-.6.2-.5.4-1.2.6-1.2 1.2-1.8.5-.5 1-.6.6-.2 1.3-.2.7 0 1.4.2.7.3.8.4.7.3.6.4.5.1.1-.2-.9-.7-.8-.4-.7-.4-.8-.4-.8-.2-.7-.1-1.5 0-.8.1-.7.2-.7.3-1.2 1-.5.6-.8 1.4-.4.6-.6 1.2-.2.7-.2.6-.1.7 0 .7.1.7.2.8.3.7.4.6.4.7 1 1 .5.4.7.3.6.2.7.2.6.2.8.2.8.1.9.2.9.1 1.6-.2.7-.3.5-.4.5-.5.8-1 .3-.6.4-.6.2-.6.3-.7.2-.7.2-1.5 0-.7-.1-.7-.4-1.4-.3-.6-.8-1.2-1.2-1-1.2-.8-.7-.2-.6-.2-.8-.1-1.4 0-.5.1-.4.1zm3.2 7.1l-.7.8-1.2.2-1.2-.4-.7-1 .1-1.2.8-.9 1.2-.2 1.2.5.7 1zm-1.9-11.7l-.6.4-.2.7-.2.8 0 .8.1.8.6.5.4 0 .6-.4.3-.7.1-.8 0-.8-.1-.7-.5-.6zm-.1 17.7l-.6.6-.1.7 0 .8.1.9.2.7.6.5.4-.1.6-.5.1-.7 0-.9-.1-.8-.2-.7-.6-.5zm-10.8-6.9l.4.6.7.3.9.1.8 0 .8-.1.5-.5.1-.4-.5-.7-.7-.2-.9-.1-.8 0-.8.1-.5.5zm17.8.4l.6.5.7.1.9 0 .9-.1.7-.2.5-.6 0-.4-.6-.6-.7-.1-.9 0-.9.2-.7.2-.5.6z"/></svg>
            <span class="lbl">My area</span></button>
          <button id="find" type="button" class="icon-btn" aria-label="Find a town" title="Find a town" aria-expanded="false" aria-controls="finder">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
            <span class="lbl">Find</span></button>
          <button id="share" type="button" class="icon-btn" aria-label="Share this view" title="Share this view">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12.3 15.6l.4-.7.2-1 .3-3.7 0-3.5-.2-1.2-.1-1-.2-.9-.4-.7-.4 0-.5.7-.2 2 0 1.1-.1 1.2 0 2.2.1 1.3 0 1.3.2 2.1.4.8zm-.5 0l.2-.7.2-1 .3-3.7 0-1.2.1-1.1 0-2.4-.2-1.9-.2-.7-.2 0-.3.6-.1.9-.2 2.3 0 2.3-.1 1.1 0 4.8.2.7zm-4-8.1l.5 0 .4-.3 1.5-1.2.4-.4.4-.5.4-.4.4-.5.4-.4-.2.1-.1-.1.1.2.3.4.4.4.8 1 .4.4.5.3.5.4.4.2.4.3.4 0 .3-.3 0-.5-.3-.3-.7-.9-.4-.4-.3-.4-.2-.3-.3-.5-.4-.5-.3-.6-.6-.5-.8-.3-.8.2-.6.5-.4.5-.3.5-.6.8-1.2 1.5-.3.5-.3.4-.1.5zm-1.5 3l-.3.4-.3.6-.2.8-.4 1.8-.2 1.7-.2 1-.1 1.1 0 1.1.2 1 .6 1 1 .5 1.1.3 5.6 0 1.1.1 2.3 0 1.1-.2 1-.6.6-1 .1-1.1 0-1.2-.4-2.1-.3-2.5-.2-.9-.1-.7-.2-.6-.3-.4-.4 0-.2 1.1.1.8 0 2.5.3 3 0 .9-.1.6-.2.3-.3.1-.7.1-2 0-2.2-.2-1.1.1-3.2 0-.8-.1-.3-.2-.2-.3-.2-.5 0-1.8.1-1 0-.9.1-.8 0-.9.3-2.3-.1-.6z"/></svg>
            <span class="lbl">Share</span></button>
          <span id="action-msg" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
