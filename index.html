<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Emergence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f5d76e'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="map" aria-label="Map of the Midwest as an H3 hex grid"></div>
    <header id="top">
      <div class="brand"><span class="dot"></span>Emergence <small>bug forecast &middot; M0 skeleton</small></div>
      <button id="info-btn" class="icon-btn" aria-label="About this layer: caveats" aria-expanded="false" aria-controls="drawer">i</button>
    </header>
    <section id="layers" aria-label="Layers"></section>
    <aside id="drawer" aria-hidden="true" aria-label="Caveats"></aside>
    <div id="bottom">
      <div id="floats">
        <div id="legend"></div>
        <div id="probe" role="status" aria-live="polite" hidden></div>
      </div>
      <footer id="bar" aria-label="Time controls"></footer>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
