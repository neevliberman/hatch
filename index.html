<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f2e3" />
  <title>Hatch · when luna moths fly in the Midwest</title>
  <meta name="description" content="A heat-based forecast of when luna moths emerge across the Midwest, replayed against 3,000 real iNaturalist sightings." />
  <meta property="og:title" content="Hatch · when luna moths fly" />
  <meta property="og:description" content="Scrub through a season and watch luna moths roll north with the warmth. Real sightings vs a heat forecast." />
  <meta property="og:image" content="https://neevliberman.github.io/hatch/og.png" />
  <meta property="og:url" content="https://neevliberman.github.io/hatch/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c07a16'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="map" role="img" aria-label="Map of the Midwest: luna moth sightings over hexagons colored by the forecast" aria-describedby="sr-summary"></div>
    <p id="sr-summary" class="sr"></p>
    <header id="top">
      <h1 class="brand"><span class="dot"></span>Hatch <small>when luna moths fly</small></h1>
      <label class="season"><span class="sr">Season to replay</span><select id="season"></select></label>
      <button id="info-btn" class="icon-btn" aria-label="About this map" aria-expanded="false" aria-controls="drawer">i</button>
    </header>
    <aside id="drawer" aria-hidden="true" aria-label="About this map"></aside>
    <div id="bottom">
      <section id="layers" aria-label="Layers" hidden></section>
      <div id="floats">
        <div id="legend"></div>
        <div id="probe" role="status" aria-live="polite" hidden></div>
      </div>
      <button id="recenter" type="button" class="icon-btn" aria-label="Back to the whole Midwest" title="Back to the whole Midwest" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 15H3v4a2 2 0 0 0 2 2h4v-2H5v-4zM5 5h4V3H5a2 2 0 0 0-2 2v4h2V5zm14-2h-4v2h4v4h2V5a2 2 0 0 0-2-2zm0 16h-4v2h4a2 2 0 0 0 2-2v-4h-2v4zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      </button>
      <div id="strip">
        <div id="note">
          <p id="honesty"><span>Dots: real sightings<span class="long">, <b id="season-name"></b></span>. Colors: a forecast <em class="unconfirmed">still being tested</em>.</span>
            <button id="why" type="button">How sure?</button></p>
          <p id="countdown"></p>
        </div>
        <div id="actions">
          <button id="locate" type="button" class="icon-btn" aria-label="My area" title="My area: show the forecast where you are">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
            <span class="lbl">My area</span></button>
          <button id="share" type="button" class="icon-btn" aria-label="Share this view" title="Share a link to this season and day">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2 7.5 6.5l1.4 1.4L11 5.8V15h2V5.8l2.1 2.1 1.4-1.4L12 2zM5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10h-2v10H7V10H5z"/></svg>
            <span class="lbl">Share</span></button>
          <span id="action-msg" role="status" aria-live="polite"></span>
        </div>
      </div>
      <footer id="bar" aria-label="Time controls"></footer>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
