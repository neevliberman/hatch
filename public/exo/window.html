<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a window onto one real place. Place and weather top-left, what she is doing bottom-left, a 24-hour strip along the bottom edge. */
:root { --paper: #f7f7f4; --ink: #141414; --soft: #5c5c58; --warm: #d9620f; --hand: "Caveat", "Segoe Print", cursive; --display: "Instrument Serif", Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, monospace; }
body.night { --paper: #1d2230; --ink: #ededE8; --soft: #a9afbf; --warm: #fb923c; }
html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.place { font: 400 .78rem/1.35 var(--mono); color: var(--soft); }
.place b { display: block; font: italic 400 1.7rem/1 var(--display); color: var(--ink); }
.top button { pointer-events: auto; font: 700 1.2rem/1 var(--hand); color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--soft); padding: 6px 2px; cursor: pointer; white-space: nowrap; }
.say { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.say h1 { margin: 0; font: 700 2rem/1.05 var(--hand); color: var(--ink); text-shadow: 0 0 5px var(--paper), 0 0 10px var(--paper); text-wrap: balance; max-width: 18ch; }
.say p { margin: 4px 0 0; font: 700 1.25rem/1.15 var(--hand); color: var(--warm); text-shadow: 0 0 5px var(--paper); max-width: 28ch; }
.hours { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
.hours button { appearance: none; border: 1px solid var(--ink); background: var(--paper); height: 30px; padding: 0; cursor: pointer; position: relative; }
.hours button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 1; }
.hours button i { position: absolute; inset: 0; opacity: .85; }
.hours button.now::after { content: ""; position: absolute; left: 50%; top: -6px; width: 0; height: 0; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--ink); }
.hours button:focus-visible { outline: 2px solid var(--warm); outline-offset: 1px; z-index: 2; }
.ticks { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(42px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, 1fr); font: 400 .62rem var(--mono); color: var(--soft); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="A monarch on milkweed, doing what a real one would do in this place's weather right now."></canvas>
<div class="top"><div class="place"><b id="place"></b><span id="wx"></span></div><button id="loc" type="button">use my location</button></div>
<div class="say" aria-live="polite"><h1 id="h"></h1><p id="p"></p></div>
<div class="ticks"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span></div>
<div class="hours" id="hours" role="group" aria-label="Hours of the day"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
const resize = () => { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const Q = new URLSearchParams(location.search);

// ---------- what a monarch does in this air ----------
// states, from the weather alone: roost (night), shelter (rain), cling (wind), torpid (cold), bask (cool sun), fly (warm)
function behave(w) {
  const sunny = w.day && w.cloud < 60;
  if (!w.day) return 'roost';
  if (w.rain > 0.2) return 'shelter';
  if (w.wind > 32) return 'cling';
  // a monarch needs a warm thorax: air plus sun, and it will not fly below about 13 C
  const eff = w.t + (sunny ? 4 : w.cloud < 85 ? 1.5 : 0);
  if (eff < 12) return 'torpid';
  if (eff < 17) return 'bask';
  return 'fly';
}
const COPY = {
  roost:   ['Asleep.', 'Hanging under the leaves until the sun is up.'],
  shelter: ['Waiting out the rain.', 'Wet wings are heavy. She sits tight under a leaf.'],
  cling:   ['Too windy.', 'She holds on and keeps her wings folded.'],
  torpid:  ['Too cold to fly.', 'Her flight muscles need to be warm, and they are not.'],
  bask:    ['Basking.', 'Wings open to the sun, warming her flight muscles.'],
  fly:     ['Flying.', 'Warm enough to feed, wander and look for milkweed.'],
};
const HUE = { roost: '#3b4252', shelter: '#7c93b3', cling: '#a8a29a', torpid: '#9bb5d6', bask: '#f0c63a', fly: '#e8861f' };

// ---------- the weather ----------
const place = { name: Q.get('name') || 'Chicago', lat: +Q.get('lat') || 41.88, lon: +Q.get('lon') || -87.63 };
let hours = [];          // 24 entries for today: {t, cloud, rain, wind, day}
let sel = 0, nowH = 0;
async function load() {
  $('place').textContent = place.name;
  $('wx').textContent = 'loading the sky';
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&hourly=temperature_2m,cloud_cover,precipitation,wind_speed_10m,is_day&forecast_days=1&timezone=auto&wind_speed_unit=kmh`;
    const r = await fetch(u); const j = await r.json(); const h = j.hourly;
    hours = h.time.map((_, i) => ({ t: h.temperature_2m[i], cloud: h.cloud_cover[i], rain: h.precipitation[i], wind: h.wind_speed_10m[i], day: !!h.is_day[i] }));
    // "now" in the place's own timezone: open-meteo returns local times without an offset
    const nowLocal = new Date(Date.now() + (j.utc_offset_seconds ?? 0) * 1000);
    nowH = Q.get('hour') != null ? +Q.get('hour') : nowLocal.getUTCHours();
  } catch (e) { hours = []; }
  if (!hours.length) { $('wx').textContent = 'could not reach the weather'; $('h').textContent = 'No sky.'; $('p').textContent = 'Check your connection and reload.'; return; }
  sel = nowH; build();
}
function build() {
  const el = $('hours'); el.innerHTML = '';
  hours.forEach((w, i) => {
    const b = document.createElement('button'); b.type = 'button';
    b.setAttribute('aria-label', `${i % 12 || 12} ${i < 12 ? 'AM' : 'PM'}: ${behave(w)}`);
    b.innerHTML = `<i style="background:${HUE[behave(w)]}"></i>`;
    if (i === nowH) b.classList.add('now');
    b.addEventListener('click', () => { sel = i; show(); });
    el.appendChild(b);
  });
  show();
}
function show() {
  const w = hours[sel], s = behave(w);
  [...$('hours').children].forEach((b, i) => b.setAttribute('aria-pressed', i === sel ? 'true' : 'false'));
  const label = `${sel % 12 || 12} ${sel < 12 ? 'AM' : 'PM'}${sel === nowH ? ' (now)' : ''}`;
  $('wx').textContent = `${label} · ${Math.round(w.t)}°C · ${Math.round(w.t * 9 / 5 + 32)}°F · ${w.cloud}% cloud`;
  $('h').textContent = COPY[s][0];
  // when does she next fly?
  let next = '';
  if (s !== 'fly') { const k = hours.findIndex((x, i) => i > sel && behave(x) === 'fly'); next = k >= 0 ? `She should fly from ${k % 12 || 12} ${k < 12 ? 'AM' : 'PM'}.` : 'No flying weather today.'; }
  $('p').textContent = `${COPY[s][1]} ${next}`.trim();
  document.body.classList.toggle('night', !w.day);
  state.to = s; state.w = w;
}

// ---------- the scene ----------
const state = { to: 'bask', w: { t: 20, cloud: 20, rain: 0, wind: 5, day: true }, cur: 'bask', open: 0.5, rate: 0.3, phase: 0, x: 0, y: 0, tx: 0, ty: 0, wait: 0, face: 1, mix: 1, rainT: 0 };
const plants = [];
function layout() { plants.length = 0; const gy = H * 0.84; const n = W < 520 ? 3 : 5; for (let i = 0; i < n; i++) plants.push({ x: W * (0.18 + 0.64 * (i / (n - 1))) + (i % 2 ? 14 : -10), h: H * (0.2 + 0.07 * ((i * 7) % 3)), ph: i * 1.7, y: gy }); }
addEventListener('resize', layout); layout();
function pen(c = '#141414', w = 1.6) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }

function wing(ext, far) {
  ctx.save(); ctx.scale(1, ext);
  ctx.fillStyle = far ? 'rgba(232,150,60,.55)' : 'rgba(240,138,36,.95)'; pen('#141414', (far ? 1.1 : 1.7) / Math.max(ext, 0.3));
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(8, -28, 36, -48, 54, -34); ctx.bezierCurveTo(58, -18, 30, -6, 0, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-6, -14, -24, -34, -40, -26); ctx.bezierCurveTo(-46, -12, -22, -2, 0, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1 / Math.max(ext, 0.3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(48, -33); ctx.moveTo(0, 0); ctx.lineTo(34, -14); ctx.moveTo(0, 0); ctx.lineTo(-34, -25); ctx.moveTo(0, 0); ctx.lineTo(-30, -9); ctx.stroke();
  ctx.fillStyle = '#141414'; for (const [px, py] of [[52, -30], [46, -38], [38, -42], [-40, -24], [-34, -30]]) { ctx.beginPath(); ctx.arc(px, py, 1.5, 0, 7); ctx.fill(); }
  ctx.restore();
}
function butterfly(x, y, sc, face, ext, rot) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc * face, sc); ctx.rotate(rot);
  ctx.save(); ctx.translate(-3, -1); ctx.rotate(-0.18); wing(clamp(ext * 0.92, 0.1, 1), true); ctx.restore();
  ctx.fillStyle = '#141414'; pen('#141414', 1.6); ctx.beginPath(); ctx.ellipse(-4, 3, 22, 3.6, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(19, 2, 3.5, 0, 7); ctx.fill();
  ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(20, 0); ctx.quadraticCurveTo(28, -9, 33, -8); ctx.moveTo(20, 0); ctx.quadraticCurveTo(26, -4, 32, -2); ctx.stroke();
  ctx.save(); ctx.rotate(-0.18); wing(ext, false); ctx.restore();
  ctx.restore();
}

function perch(i) { const p = plants[i % plants.length]; return [p.x + Math.sin(clock * 1.3 + p.ph) * 2, p.y - p.h]; }
let clock = 0, last = performance.now(), tgtPlant = 0;
function update(dt) {
  const s = state.to; state.cur = s;
  const sc = clamp(Math.min(W, H) / 380, 1, 1.7);
  // wing posture by state: open amount (0 closed, 1 flat open) and beat rate (Hz)
  let open, rate;
  switch (s) { case 'roost': case 'shelter': case 'cling': open = 0.12; rate = 0; break; case 'torpid': open = 0.14; rate = 0.15; break; case 'bask': open = 0.92; rate = 0.18; break; default: open = 0.6; rate = 5.2; }
  state.mix += (1 - state.mix) * Math.min(1, 3 * dt);
  state.open += (open - state.open) * Math.min(1, 2.5 * dt); state.rate += (rate - state.rate) * Math.min(1, 2.5 * dt);
  state.phase += Math.PI * 2 * state.rate * dt;
  // where she is: on a flower, or between them while flying
  if (!state.init) { [state.x, state.y] = perch(0); state.init = 1; }
  if (s === 'fly') {
    state.wait -= dt;
    if (state.wait <= 0) { tgtPlant = (tgtPlant + 1 + Math.floor(Math.random() * 2)) % plants.length; state.wait = 3 + Math.random() * 3; }
    const [px, py] = perch(tgtPlant); const hover = state.wait > 1.2 ? 0 : 1;
    state.tx = px; state.ty = py - (hover ? 0 : 0) - 8 + Math.sin(clock * 2.2) * 10 * (state.wait > 0.8 ? 1 : 0);
  } else { const [px, py] = perch(tgtPlant); state.tx = px; state.ty = py + (s === 'roost' ? 30 * sc : s === 'shelter' ? 16 : 0); }
  const k = Math.min(1, (s === 'fly' ? 1.4 : 2) * dt);
  const nx = lerp(state.x, state.tx, k), ny = lerp(state.y, state.ty, k);
  if (Math.abs(nx - state.x) > 0.3) state.face = nx > state.x ? 1 : -1;
  state.vx = nx - state.x; state.vy = ny - state.y; state.x = nx; state.y = ny; state.sc = sc;
}

function draw() {
  const w = state.w, gy = H * 0.84, night = !w.day;
  // sky: paper by day, deep ink-blue at night; cloud cover greys it
  const g = ctx.createLinearGradient(0, 0, 0, gy);
  if (night) { g.addColorStop(0, '#1d2230'); g.addColorStop(1, '#2c3347'); } else { const gr = Math.round(lerp(0xf7, 0xcf, w.cloud / 100)); g.addColorStop(0, `rgb(${gr - 6},${gr - 2},${gr + 4})`); g.addColorStop(1, '#f7f7f4'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, gy);
  ctx.fillStyle = night ? '#232938' : 'rgba(120,140,100,.12)'; ctx.fillRect(0, gy, W, H - gy);
  // sun or moon
  const sx = W * 0.78, sy = H * 0.15;
  if (!night) {
    const a = 1 - w.cloud / 130;
    const gl = ctx.createRadialGradient(sx, sy, 6, sx, sy, Math.max(W, H) * 0.5); gl.addColorStop(0, `rgba(255,207,122,${0.5 * a})`); gl.addColorStop(1, 'rgba(255,226,176,0)'); ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    pen('#d9620f', 1.5); ctx.globalAlpha = 0.4 + 0.6 * a; ctx.beginPath(); ctx.arc(sx, sy, 18, 0, 7); ctx.stroke();
    for (let i = 0; i < 12; i++) { const an = i / 12 * 6.283 + clock * 0.05; ctx.beginPath(); ctx.moveTo(sx + Math.cos(an) * 26, sy + Math.sin(an) * 26); ctx.lineTo(sx + Math.cos(an) * 38, sy + Math.sin(an) * 38); ctx.stroke(); }
    ctx.globalAlpha = 1;
  } else { pen('#d8d4c4', 1.5); ctx.beginPath(); ctx.arc(sx, sy, 16, 0.5, 5.8); ctx.stroke(); ctx.fillStyle = '#d8d4c4'; for (let i = 0; i < 24; i++) { ctx.beginPath(); ctx.arc((i * 137) % W, ((i * 71) % (gy * 0.6)), 1.1, 0, 7); ctx.fill(); } }
  // clouds by cover
  const nc = Math.round(w.cloud / 100 * 5);
  for (let i = 0; i < nc; i++) {
    const cx = ((i * 0.23 + 0.1 + clock * 0.004 * (1 + i * 0.3) + (w.wind / 400) * clock * 0.02) % 1.3 - 0.15) * W, cy = H * (0.12 + 0.1 * (i % 3)), cw = 120 + (i % 3) * 40;
    ctx.fillStyle = night ? 'rgba(80,90,110,.5)' : 'rgba(110,122,142,.28)';
    ctx.beginPath(); ctx.ellipse(cx, cy, cw * 0.5, 22, 0, 0, 7); ctx.ellipse(cx - cw * 0.2, cy - 14, cw * 0.26, 20, 0, 0, 7); ctx.ellipse(cx + cw * 0.18, cy - 10, cw * 0.22, 17, 0, 0, 7); ctx.fill();
    pen(night ? '#8a93a8' : '#141414', 1.3); ctx.beginPath(); ctx.ellipse(cx, cy, cw * 0.5, 22, 0, Math.PI * 0.9, Math.PI * 2.1); ctx.stroke();
  }
  // ground line and milkweed
  pen(night ? '#8a93a8' : '#141414', 1.6); ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  const wind = clamp(w.wind / 30, 0, 1.6);
  plants.forEach((p, i) => {
    const sway = Math.sin(clock * (1 + wind) + p.ph) * (2 + wind * 6), hy = p.y - p.h;
    pen(night ? '#8a93a8' : '#141414', 1.4); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo(p.x + sway * 0.5, p.y - p.h * 0.5, p.x + sway, hy); ctx.stroke();
    ctx.fillStyle = night ? 'rgba(90,120,90,.6)' : 'rgba(160,190,140,.75)';
    for (const [d, f] of [[-1, 0.35], [1, 0.55], [-1, 0.7]]) { ctx.beginPath(); ctx.ellipse(p.x + d * 14 + sway * f, p.y - p.h * f, 14, 5, d * -0.5, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = night ? '#9b6a7a' : '#e9879f';
    for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283; ctx.beginPath(); ctx.arc(p.x + sway + Math.cos(a) * 8, hy + Math.sin(a) * 6, 4.6, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(p.x + sway, hy, 5, 0, 7); ctx.fill(); ctx.stroke();
  });
  // rain
  if (w.rain > 0.2) { pen('#5b6f8c', 1); ctx.globalAlpha = 0.6; for (let i = 0; i < 60; i++) { const x = ((i * 97 + clock * 40 * wind) % (W + 40)) - 20, y = ((i * 53 + clock * 420) % gy); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4 - wind * 4, y + 12); ctx.stroke(); } ctx.globalAlpha = 1; }
  // the monarch
  const sc = (state.sc || 1) * 0.95;
  const s = state.cur;
  const beat = 0.5 + 0.5 * Math.sin(state.phase);
  let ext;
  if (s === 'bask') ext = clamp(0.35 + 0.6 * state.open * (0.85 + 0.15 * beat), 0.15, 1);
  else if (s === 'fly') ext = clamp(0.15 + 0.85 * (0.3 + 0.7 * beat), 0.12, 1);
  else ext = 0.12 + 0.02 * Math.sin(clock);
  const hang = s === 'roost' ? Math.PI : 0;
  const rot = s === 'fly' ? clamp(state.vy * 0.05, -0.4, 0.4) : s === 'roost' ? 0 : -0.25;
  ctx.save();
  if (s === 'roost') { ctx.translate(state.x, state.y); ctx.rotate(Math.PI / 2); butterfly(0, 0, sc, 1, 0.3, 0); }
  else butterfly(state.x, state.y + (s === 'fly' ? -Math.cos(state.phase) * 2.5 : 0), sc, state.face, ext, rot);
  ctx.restore();
  if (s === 'shelter') { // a leaf held over her
    const p = plants[tgtPlant % plants.length], px = p.x, py = p.y - p.h - 26 * sc;
    ctx.fillStyle = 'rgba(150,185,130,.9)'; pen('#141414', 1.5); ctx.beginPath(); ctx.moveTo(px - 46, py + 10); ctx.quadraticCurveTo(px, py - 34, px + 46, py + 10); ctx.quadraticCurveTo(px, py + 2, px - 46, py + 10); ctx.fill(); ctx.stroke();
  }
}

function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt; if (hours.length) { update(dt); } draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

$('loc').addEventListener('click', () => {
  if (!navigator.geolocation) { $('loc').textContent = 'no location here'; return; }
  navigator.geolocation.getCurrentPosition(p => { place.lat = p.coords.latitude; place.lon = p.coords.longitude; place.name = 'Your place'; $('loc').hidden = true; load(); }, () => { $('loc').textContent = 'location blocked'; });
});
if (Q.has('lat')) $('loc').hidden = true;
load();
window.__window = { state, behave, get hours() { return hours; }, pick: i => { sel = i; show(); } };
})();
</script>
</body>
</html>
