<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: the animal fills the page; a thread runs down the left edge and its beads are the stages. Drag anywhere. */
:root { --paper: #f7f7f4; --ink: #141414; --soft: #5c5c58; --warm: #d9620f; --hand: "Caveat", "Segoe Print", cursive; --display: "Instrument Serif", Georgia, serif; }
html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: ns-resize; }
.cap { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: calc(max(16px, env(safe-area-inset-left, 0px)) + 96px); display: grid; gap: 2px; justify-items: end; text-align: right; pointer-events: none; }
.cap h1 { margin: 0; font: italic 400 2rem/1 var(--display); }
.cap p { margin: 0; font: 700 1.3rem/1.15 var(--hand); color: var(--soft); max-width: 24ch; text-wrap: balance; }
.day { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font: 700 1.3rem/1 var(--hand); color: var(--soft); pointer-events: none; }
.day b { font: italic 400 1.6rem/1 var(--display); color: var(--ink); }
.hint { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(max(16px, env(safe-area-inset-left, 0px)) + 64px); font: 700 1.2rem/1 var(--hand); color: var(--warm); pointer-events: none; transition: opacity .5s; }
.hint.off { opacity: 0; }
.stages { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); top: 0; bottom: 0; width: 92px; pointer-events: none; }
.stages button { position: absolute; left: 0; transform: translateY(-50%); font: 700 1.05rem/1 var(--hand); color: var(--soft); background: none; border: 0; padding: 6px 4px 6px 28px; cursor: pointer; pointer-events: auto; text-align: left; white-space: nowrap; }
.stages button[aria-current="true"] { color: var(--warm); }
.stages button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A monarch changing through its life as you drag. Drag up and down."></canvas>
<div class="stages" id="stages"></div>
<div class="day" id="day"></div>
<div class="hint" id="hint">pull the thread down</div>
<div class="cap" aria-live="polite"><h1 id="name"></h1><p id="fact"></p></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
const resize = () => { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); layout(); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// life stages: where each starts on the thread (0..1), the day it starts, and what to say
const S = [
  { n: 'Egg',        t: 0.00, d: 0,  title: 'Egg',        fact: 'A pinhead under a milkweed leaf.' },
  { n: 'Caterpillar', t: 0.12, d: 4,  title: 'Caterpillar', fact: 'Eats milkweed. Grows about 2,700 times heavier in two weeks.' },
  { n: 'Chrysalis',  t: 0.52, d: 16, title: 'Chrysalis',  fact: 'Inside, the body dissolves and rebuilds. Wing colors show through.' },
  { n: 'Emerges',    t: 0.82, d: 27, title: 'Wings',      fact: 'Wet and crumpled. It pumps them full of fluid.' },
  { n: 'Flies',      t: 0.91, d: 28, title: 'Monarch',    fact: 'Fall-born monarchs live about 8 months and fly to Mexico.' },
];
const DAYS_END = 40;
const dayAt = t => {
  let i = S.length - 1; while (i > 0 && t < S[i].t) i--;
  const a = S[i], b = S[i + 1] || { t: 1, d: DAYS_END };
  return lerp(a.d, b.d, (t - a.t) / (b.t - a.t));
};

// ---------- state: t is where the thread is pulled to, v eases toward it ----------
let target = 0, v = 0, dragging = false, lastY = 0, moved = false;
const THREAD_TOP = () => H * 0.1, THREAD_BOT = () => H * 0.9;
function layout() {
  const el = $('stages'); el.innerHTML = '';
  S.forEach((s, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s.n; b.dataset.i = i;
    b.style.top = lerp(THREAD_TOP(), THREAD_BOT(), s.t) + 'px';
    b.addEventListener('click', () => { target = s.t; });
    el.appendChild(b);
  });
}
addEventListener('resize', resize);

cv.addEventListener('pointerdown', e => { dragging = true; moved = false; lastY = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dy = e.clientY - lastY; lastY = e.clientY;
  if (Math.abs(dy) > 0) moved = true;
  target = clamp(target + dy / (THREAD_BOT() - THREAD_TOP()) * 1.1, 0, 1);
  hint();
});
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });
addEventListener('wheel', e => { target = clamp(target + e.deltaY / 1600, 0, 1); hint(); }, { passive: true });
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowDown' || k === 'ArrowRight') { target = clamp(target + 0.03, 0, 1); hint(); e.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'ArrowLeft') { target = clamp(target - 0.03, 0, 1); e.preventDefault(); }
});
function hint() { $('hint').classList.add('off'); }

// ---------- pen ----------
function pen(c = '#141414', w = 1.6) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function wob(x0, y0, x1, y1, sd, amp = 1.2) {
  const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 16));
  ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let i = 1; i <= n; i++) { const u = i / n, j = Math.sin(sd * 12.9 + i * 78.2) * amp; ctx.lineTo(lerp(x0, x1, u) + j * 0.4, lerp(y0, y1, u) + j); }
  ctx.stroke();
}

// ---------- scene pieces (all in a local frame centered on the animal, unit = px at scale sc) ----------
function leaf(cx, cy, sc, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(150,185,130,.55)'; pen();
  ctx.beginPath(); ctx.moveTo(-190, 20); ctx.bezierCurveTo(-120, -80, 120, -80, 200, 10); ctx.bezierCurveTo(120, 80, -110, 90, -190, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-190, 20); ctx.quadraticCurveTo(0, 0, 200, 10); ctx.stroke();
  for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 45, 8 + Math.abs(i)); ctx.lineTo(i * 45 + 30, i < 0 ? -45 + Math.abs(i) * 6 : 55 - Math.abs(i) * 4); ctx.stroke(); }
  ctx.restore();
}

function egg(cx, cy, sc, t, a) {
  // t 0..1 within the egg stage: a pale cone that darkens as the caterpillar forms inside
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sc, sc);
  const dark = sm(0.55, 1, t);
  ctx.fillStyle = `rgb(${Math.round(lerp(238, 120, dark))},${Math.round(lerp(236, 118, dark))},${Math.round(lerp(210, 100, dark))})`; pen('#141414', 1.8 / sc);
  ctx.beginPath(); ctx.moveTo(-9, 10); ctx.quadraticCurveTo(-10, -14, 0, -18); ctx.quadraticCurveTo(10, -14, 9, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 0.8 / sc; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 3.5, 9); ctx.lineTo(i * 1.8, -15); ctx.stroke(); }
  ctx.restore();
}

function cat(cx, cy, sc, size, curl, wig, a) {
  // caterpillar: ten banded segments along a curve; size 0..1 is growth, curl 0..1 bends it into a J
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sc, sc);
  const n = 11, L = lerp(34, 330, size), R = lerp(5, 30, size);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    // straight crawl, blending into a J hanging from the top
    const sx = -L / 2 + u * L, sy = Math.sin(u * 6.28 + wig) * 3 * (1 - curl) * size;
    const ang = lerp(0, Math.PI * 0.95, u) * curl, jx = Math.sin(ang) * L * 0.34 * (1 - u * 0.2), jy = -L * 0.34 + (1 - Math.cos(ang)) * L * 0.34 + u * L * 0.45 * (1 - curl * 0.6);
    pts.push([lerp(sx, jx, curl), lerp(sy, jy, curl)]);
  }
  for (let i = n; i >= 0; i--) {
    const [x, y] = pts[i], r = R * (i === n ? 0.9 : 0.78 + 0.22 * Math.sin(i / n * 3.14));
    const band = i % 3;
    ctx.fillStyle = band === 0 ? '#f2f2e2' : band === 1 ? '#f0c63a' : '#1b1b1b';
    pen('#141414', 1.6 / sc); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
    if (band === 2) { ctx.fillStyle = '#f2f2e2'; ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, 7); ctx.fill(); }
  }
  // head and two pairs of tentacles
  const [hx, hy] = pts[n], [px, py] = pts[n - 1];
  const dx = hx - px, dy = hy - py, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  ctx.fillStyle = '#e7d9a0'; pen('#141414', 1.6 / sc); ctx.beginPath(); ctx.arc(hx + ux * R * 0.5, hy + uy * R * 0.5, R * 0.8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.5 / sc; ctx.beginPath(); ctx.moveTo(hx, hy - R * 0.6); ctx.lineTo(hx + R * 0.2, hy - R * 1.9); ctx.moveTo(pts[1][0], pts[1][1] - R * 0.7); ctx.lineTo(pts[1][0] - R * 0.5, pts[1][1] - R * 1.6); ctx.stroke();
  ctx.restore();
}

function chrysalis(cx, cy, sc, show, wing, a) {
  // hangs from a silk pad: jade teardrop, a gold crown, and the wing slowly showing through
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sc, sc);
  const h = 118, w = 40;
  pen('#141414', 1.8 / sc); ctx.lineWidth = 1.2; wobLine(0, -170, 0, -h * 0.5, 3);
  ctx.fillStyle = '#a5d890'; pen('#141414', 2 / sc);
  ctx.beginPath(); ctx.moveTo(-9, -h * 0.5); ctx.bezierCurveTo(-w, -h * 0.35, -w * 1.1, h * 0.2, -4, h * 0.55); ctx.lineTo(4, h * 0.55); ctx.bezierCurveTo(w * 1.1, h * 0.2, w, -h * 0.35, 9, -h * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  // wing pattern: orange cells with black veins fading in as the pupa darkens
  if (wing > 0.01) {
    ctx.save(); ctx.globalAlpha = a * wing; ctx.clip();
    ctx.fillStyle = '#e88a22'; ctx.fillRect(-w, -h * 0.3, w * 2, h);
    pen('#141414', 1.6 / sc); for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 9, -h * 0.35); ctx.lineTo(i * 12, h * 0.55); ctx.stroke(); }
    ctx.fillStyle = '#141414'; ctx.fillRect(-w, h * 0.38, w * 2, h * 0.2);
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(-9, -h * 0.5); ctx.bezierCurveTo(-w, -h * 0.35, -w * 1.1, h * 0.2, -4, h * 0.55); ctx.lineTo(4, h * 0.55); ctx.bezierCurveTo(w * 1.1, h * 0.2, w, -h * 0.35, 9, -h * 0.5); ctx.closePath(); pen('#141414', 2 / sc); ctx.stroke();
  }
  ctx.fillStyle = '#e6b830'; pen('#141414', 1 / sc);
  for (let i = 0; i < 9; i++) { const u = i / 8, x = lerp(-w * 0.9, w * 0.9, u), y = -h * 0.34 + Math.sin(u * 3.14) * 5; ctx.beginPath(); ctx.arc(x * 0.98, y + 8, 2.4, 0, 7); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function wobLine(x0, y0, x1, y1, sd) { wob(x0, y0, x1, y1, sd, 1); }

function shell(cx, cy, sc, a) {
  // the empty case left behind: clear, collapsed
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sc, sc);
  pen('#141414', 1.2 / sc); wob(0, -170, 0, -59, 3, 1);
  ctx.fillStyle = 'rgba(190,225,180,.35)'; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(-9, -59); ctx.bezierCurveTo(-38, -41, -44, 24, -4, 65); ctx.lineTo(4, 65); ctx.bezierCurveTo(44, 24, 38, -41, 9, -59); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}

function wingPair(cx, cy, sc, open, droop, a, flap) {
  // monarch seen from above-front: four orange wings with black veins and white-dotted margins
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sc, sc);
  for (const side of [-1, 1]) {
    ctx.save(); ctx.scale(side * open, 1);
    const crumple = 1 - droop;
    ctx.rotate(-flap * 0.5);
    ctx.fillStyle = '#f08a24'; pen('#141414', 2.2 / sc);
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.bezierCurveTo(30, -110 * crumple, 130, -150 * crumple, 175, -100 * crumple); ctx.bezierCurveTo(170, -40, 80, -4, 4, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 6); ctx.bezierCurveTo(70, 8, 150, 40, 120, 100 * (0.5 + 0.5 * crumple)); ctx.bezierCurveTo(70, 118 * (0.5 + 0.5 * crumple), 20, 70, 4, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1.6 / sc;
    ctx.beginPath(); for (const [x, y] of [[170, -96], [120, -118], [90, -30], [100, -60], [100, 70], [70, 40]]) { ctx.moveTo(6, 2); ctx.lineTo(x * 0.98, y * (y < 0 ? crumple : 0.5 + 0.5 * crumple)); } ctx.stroke();
    ctx.fillStyle = '#f7f7f4';
    for (let i = 0; i < 9; i++) { const u = i / 8; ctx.beginPath(); ctx.arc(lerp(176, 120, Math.min(1, u * 2)) - (u > 0.5 ? 0 : 0) , lerp(-96, 94, u) * (u < 0.5 ? crumple : 0.5 + 0.5 * crumple), 2.4, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  // body
  ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.ellipse(0, 22, 7, 54, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -34, 8, 0, 7); ctx.fill();
  pen('#141414', 1.5 / sc); ctx.beginPath(); ctx.moveTo(-3, -40); ctx.quadraticCurveTo(-18, -70, -34, -66); ctx.moveTo(3, -40); ctx.quadraticCurveTo(18, -70, 34, -66); ctx.stroke();
  ctx.restore();
}

// ---------- compose by thread position ----------
let clock = 0;
function draw(t, dt) {
  clock += dt;
  ctx.fillStyle = '#f7f7f4'; ctx.fillRect(0, 0, W, H);
  const cx = (W + 96) / 2, cy = H * 0.47, base = Math.min(W - 110, H) / 560;     // centered in the space right of the thread rail
  const sc = clamp(base * 1.35, 0.75, 1.7);

  // warm wash behind everything, deeper later in the life
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.55);
  g.addColorStop(0, `rgba(255,214,150,${0.15 + 0.2 * sm(0.5, 1, t)})`); g.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const eggT = clamp(t / 0.12, 0, 1);
  const catT = clamp((t - 0.12) / 0.4, 0, 1);
  const pupT = clamp((t - 0.52) / 0.3, 0, 1);

  // leaf scene: egg then caterpillar, leaf slips away when the caterpillar hangs
  const leafA = 1 - sm(0.44, 0.52, t);
  if (leafA > 0.01) leaf(cx, cy + 110 * sc, sc * 0.78 * (0.9 + 0.2 * catT), leafA);
  const eggA = 1 - sm(0.1, 0.13, t);
  if (eggA > 0.01) egg(cx, cy + 82 * sc, sc * lerp(2.4, 3.2, eggT), eggT, eggA);
  const catA = sm(0.11, 0.14, t) * (1 - sm(0.5, 0.54, t));
  if (catA > 0.01) {
    const hang = sm(0.40, 0.50, t);
    cat(cx, lerp(cy + 60 * sc, cy - 40 * sc, hang), sc * lerp(1.0, 0.9, hang), 0.04 + 0.96 * Math.pow(catT, 0.8), hang, clock * 2.2 * (1 - hang), catA);
  }
  const chrA = sm(0.5, 0.56, t) * (1 - sm(0.82, 0.86, t));
  if (chrA > 0.01) chrysalis(cx, cy - 10 * sc, sc * 1.9, 1, sm(0.35, 0.95, pupT), chrA);
  // the wing shows more as the end nears; a tiny shiver before emergence
  const emT = clamp((t - 0.82) / 0.09, 0, 1);
  if (t > 0.81 && t < 0.92) {
    shell(cx, cy - 10 * sc, sc * 1.9, sm(0.82, 0.86, t));
    // hanging butterfly: wings small and drooped, expanding as fluid pumps in
    const o = lerp(0.18, 0.95, sm(0, 1, emT));
    ctx.save(); ctx.translate(cx, cy + 130 * sc); ctx.rotate(Math.PI);                       // hangs head down
    wingPair(0, 0, sc * 0.75, o, 1 - emT * 0.9, sm(0.82, 0.85, t), 0);
    ctx.restore();
  }
  const flyT = clamp((t - 0.91) / 0.09, 0, 1);
  if (t >= 0.91) {
    const flapSpeed = 5 + 5 * flyT, flap = Math.sin(clock * flapSpeed);
    const x = lerp(cx, W * 0.86, flyT * flyT), y = lerp(cy + 70 * sc, H * 0.16, flyT) + Math.sin(clock * 2) * 6;
    wingPair(x, y, sc * lerp(0.8, 0.62, flyT), 0.62 + 0.38 * flap, 0, 1, 0);
  }
  drawThread(t);
}

function drawThread(t) {
  const x = Math.max(16, 14) + 6, y0 = THREAD_TOP(), y1 = THREAD_BOT();
  pen('#141414', 1.5); wob(x, y0, x, y1, 5, 1.2);
  // thread behind the thumb is inked in orange: how far you have pulled
  const ty = lerp(y0, y1, t);
  pen('#d9620f', 2.6); ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, ty); ctx.stroke();
  S.forEach(s => { const sy = lerp(y0, y1, s.t); ctx.fillStyle = t >= s.t - 1e-6 ? '#d9620f' : '#f7f7f4'; pen('#141414', 1.4); ctx.beginPath(); ctx.arc(x, sy, 5, 0, 7); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle = '#d9620f'; pen('#f7f7f4', 2.5); ctx.beginPath(); ctx.arc(x, ty, 10, 0, 7); ctx.fill(); ctx.stroke();
  pen('#141414', 1.2); ctx.beginPath(); ctx.arc(x, ty, 11.5, 0, 7); ctx.stroke();
}

function caption(t) {
  let i = S.length - 1; while (i > 0 && t < S[i].t) i--;
  const s = S[i];
  if ($('name').textContent !== s.title) { $('name').textContent = s.title; $('fact').textContent = s.fact; }
  $('day').innerHTML = `day <b>${Math.round(dayAt(t))}</b>`;
  [...$('stages').children].forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  v += (target - v) * Math.min(1, 7 * dt);                 // the animal follows the thread with a little give
  draw(v, dt); caption(v);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
window.__thread = { set: x => { target = x; v = x; }, get t() { return v; } };
})();
</script>
</body>
</html>
